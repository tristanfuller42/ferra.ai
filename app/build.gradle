plugins { id "com.android.application" }

android {
    namespace "ai.inkwell"
    compileSdk 35
    defaultConfig {
        applicationId "ai.inkwell"
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName "1.1"
        resourceConfigurations += ["en"]
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Debug key so the APK installs directly. Swap for a real key before publishing.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    dependenciesInfo { includeInApk false; includeInBundle false }
    packaging { resources { excludes += ["**"] } }
    testOptions { unitTests { includeAndroidResources = true; all { jvmArgs "-Xmx3g", "--add-opens=java.base/java.io=ALL-UNNAMED", "--add-opens=java.base/java.lang=ALL-UNNAMED"; systemProperty "robolectric.graphicsMode", "NATIVE" } } }
}

dependencies {
    // Tests only (not in the app): run the real app on the JVM with real Android graphics
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
}
