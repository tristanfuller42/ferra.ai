name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: ./gradlew --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk inkwell.apk && ls -l inkwell.apk
      - uses: actions/upload-artifact@v4
        with: { name: inkwell-apk, path: inkwell.apk }
      - name: Publish to "latest" release (easy phone download)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest inkwell.apk --target "$GITHUB_SHA" --prerelease \
            --title "Latest build" --notes "Built from $GITHUB_SHA"
